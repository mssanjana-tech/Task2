<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChatFlow — A real-time chat application with beautiful UI, dark mode, and instant messaging powered by Supabase." />
    <meta name="theme-color" content="#6c63ff" />
    <title>ChatFlow — Real-Time Chat</title>
    <!-- Prevent FOUC: apply saved theme before React loads -->
    <script>
      (function () {
        const theme = localStorage.getItem('chat-app-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
